name: Build dfu-programmer

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  Windows-x64:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: C:/msys64/usr/bin/bash.exe --noprofile --norc -e -x -o pipefail {0}

    steps:
      - uses: actions/checkout@v7

      - name: Override Version String
        if: "!startsWith(github.ref, 'refs/tags/v')"
        id: override
        shell: bash
        run: echo 'override=PACKAGE_STRING="dfu-programmer ${{ github.ref_name }} ${{ github.sha }}"' >> $GITHUB_OUTPUT

      - name: Get version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: bash
        run: echo version=${GITHUB_REF#refs/tags/v} >> $GITHUB_OUTPUT

      - name: Dependencies
        run: |
          # Fix issues with MSYS2 and cygwin tools conflicting by just using MSYS2
          export PATH=/usr/bin:/usr/local/bin

          # While some of these are already available, they are cygwin versions which are incompatible with MSYS2
          pacman --color always --noconfirm -Sy automake-wrapper autoconf-wrapper make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-libusb

      - name: Bootstrap
        run: |
          export PATH=/usr/bin:/usr/local/bin:/ucrt64/bin
          ./bootstrap.sh

      - name: Configure
        run: |
          export PATH=/usr/bin:/usr/local/bin:/ucrt64/bin
          ./configure CFLAGS="-O2" --enable-werror --disable-dependency-tracking ${{ steps.override.outputs.override }}

      - name: Build
        run: |
          export PATH=/usr/bin:/usr/local/bin:/ucrt64/bin
          make -j4

      - name: Unit tests
        run: |
          export PATH=/usr/bin:/usr/local/bin:/ucrt64/bin
          make -j4 check || { cat test-suite.log test/unit/*.log; exit 1; }

      - name: Prep dist
        shell: pwsh
        run: |
          mkdir dist

          # The binary
          cp src/dfu-programmer.exe dist/

          # The docs
          cp docs/dfu-programmer.html dist/

          # Libusb 1.0
          cp C:/msys64/ucrt64/bin/libusb-1.0.dll dist/
          cp C:/msys64/ucrt64/share/licenses     dist/ -Recurse

      - name: Upload dist as Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows x64 - dfu-programmer
          path: dist

      - name: Test
        shell: pwsh
        run: dist/dfu-programmer.exe --help

      - name: Make release archives of binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: dist
        run: |
          7z a -tzip ../dfu-programmer-x64-${{ steps.version.outputs.version }}.zip *
          7z a -t7z  ../dfu-programmer-x64-${{ steps.version.outputs.version }}.7z  *

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fail_on_unmatched_files: true
          files: |
            dfu-programmer-x64-${{ steps.version.outputs.version }}.zip
            dfu-programmer-x64-${{ steps.version.outputs.version }}.7z

  Linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - run: sudo apt-get install -y libusb-1.0-0-dev

      - uses: actions/checkout@v7

      - name: Override Version String
        if: "!startsWith(github.ref, 'refs/tags/v')"
        id: override
        run: echo 'override=PACKAGE_STRING="dfu-programmer ${{ github.ref_name }} ${{ github.sha }}"' >> $GITHUB_OUTPUT

      - name: Get version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo version=${GITHUB_REF#refs/tags/v} >> $GITHUB_OUTPUT

      - name: Get Changes
        if: startsWith(github.ref, 'refs/tags/v')
        id: changes
        run: |
          echo "## Changes" > CHANGES
          echo "" >> CHANGES
          sed -ne '2,/^== Release/p' NEWS | head -n -2 >> CHANGES

      - name: bootstrap
        run: ./bootstrap.sh

      - name: configure
        run: ./configure CFLAGS="-O2" --enable-werror --disable-dependency-tracking ${{ steps.override.outputs.override }}

      - name: make
        run: make -j4

      - name: Unit tests
        run: make -j4 check || { cat test-suite.log test/unit/*.log; exit 1; }

      - name: Test
        run: src/dfu-programmer --help

      # Hardware-free tests (test/standalone.ts). The USB tests need the
      # AVR Test HAT runner and live in test.yml.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:standalone

      - name: Upload Binary as Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Linux x64 - dfu-programmer binary
          path: src/dfu-programmer

      - name: make dist
        run: make -j4 dist

      - name: Upload Tarball as Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Linux x64 - dfu-programmer dist
          path: "*.tar.gz"

      - name: Make release archives of binaries
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: src
        run: |
          7z a -tzip ../dfu-programmer-linux-${{ steps.version.outputs.version }}.zip dfu-programmer
          7z a -t7z  ../dfu-programmer-linux-${{ steps.version.outputs.version }}.7z  dfu-programmer

      # Builds the tarball the way users and packagers do (no bootstrap.sh),
      # out of tree, then runs make check, install, uninstall and distclean.
      - name: make distcheck
        run: make -j4 distcheck DISTCHECK_CONFIGURE_FLAGS=--enable-werror

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          body_path: CHANGES
          fail_on_unmatched_files: true
          files: |
            dfu-programmer-*.tar.gz
            dfu-programmer-linux-${{ steps.version.outputs.version }}.zip
            dfu-programmer-linux-${{ steps.version.outputs.version }}.7z

  macOS:
    name: macOS x64
    runs-on: macos-15-intel

    steps:
      - run: brew install automake libusb pkgconf

      - uses: actions/checkout@v7

      - name: Override Version String
        if: "!startsWith(github.ref, 'refs/tags/v')"
        id: override
        run: echo 'override=PACKAGE_STRING="dfu-programmer ${{ github.ref_name }} ${{ github.sha }}"' >> $GITHUB_OUTPUT

      - name: Get version
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        run: echo version=${GITHUB_REF#refs/tags/v} >> $GITHUB_OUTPUT

      - name: bootstrap
        run: ./bootstrap.sh

      - name: configure
        run: ./configure CFLAGS="-O2" --enable-werror --disable-dependency-tracking ${{ steps.override.outputs.override }}

      - name: make
        run: make -j4

      - name: Unit tests
        run: make -j4 check || { cat test-suite.log test/unit/*.log; exit 1; }

      - name: Test
        run: src/dfu-programmer --help

      - name: Upload Binary as Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macOS - dfu-programmer binary
          path: src/dfu-programmer

      - name: make dist
        run: make -j4 dist

      - name: Upload Tarball as Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: macOS - dfu-programmer dist
          path: "*.tar.gz"

      - name: Make release archives of binaries
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: src
        run: |
          7z a -tzip ../dfu-programmer-macOS-${{ steps.version.outputs.version }}.zip dfu-programmer
          7z a -t7z  ../dfu-programmer-macOS-${{ steps.version.outputs.version }}.7z  dfu-programmer

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          fail_on_unmatched_files: true
          files: |
            dfu-programmer-macOS-${{ steps.version.outputs.version }}.zip
            dfu-programmer-macOS-${{ steps.version.outputs.version }}.7z

  # Extra platforms and compilers. These don't publish release artifacts.
  Portability:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux arm64 (gcc)
            os: ubuntu-24.04-arm
            cc: gcc
          - name: Linux x64 (clang)
            os: ubuntu-24.04
            cc: clang
          - name: Linux x64 (ASan + UBSan)
            os: ubuntu-24.04
            cc: gcc
            cflags: -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
            ldflags: -fsanitize=address,undefined
          # Homebrew on Apple Silicon lives in /opt/homebrew, so this one
          # proves configure finds libusb through pkg-config.
          - name: macOS arm64
            os: macos-latest
            cc: clang

    steps:
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev clang

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install automake libusb pkgconf

      - uses: actions/checkout@v7

      - name: bootstrap
        run: ./bootstrap.sh

      - name: configure
        run: ./configure --enable-werror --disable-dependency-tracking CC="${{ matrix.cc }}" CFLAGS="${{ matrix.cflags || '-O2' }}" LDFLAGS="${{ matrix.ldflags }}"

      - name: make
        run: make -j4

      - name: Unit tests
        run: make -j4 check || { cat test-suite.log test/unit/*.log; exit 1; }

      - name: Test
        run: src/dfu-programmer --help

  # Build the RPM from the release tarball, the way Fedora does, so the
  # spec file can't rot unnoticed.
  Fedora-RPM:
    name: Fedora RPM
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Dependencies
        run: dnf install -y autoconf automake gcc make git tar gzip libusb1-devel pkgconf-pkg-config rpm-build rpmlint redhat-rpm-config

      - uses: actions/checkout@v7

      - name: make dist
        run: ./bootstrap.sh && ./configure --disable-dependency-tracking && make dist

      - name: rpmbuild
        run: rpmbuild -ta dfu-programmer-*.tar.gz

      - name: rpmlint
        run: rpmlint ~/rpmbuild/SRPMS/*.rpm ~/rpmbuild/RPMS/*/*.rpm
